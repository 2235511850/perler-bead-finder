<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <title>拼豆找色助手</title>
  <link rel="stylesheet" href="./css/style.css" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <header id="appHeader" class="sticky top-0 z-30 bg-white/90 backdrop-blur border-b border-slate-200">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="#/" class="flex items-center gap-2 font-semibold text-slate-800">
        <span class="inline-block w-7 h-7 rounded-md bg-gradient-to-br from-indigo-500 to-purple-500"></span>
        <span>拼豆找色助手</span>
      </a>
      <div id="headerActions" class="flex items-center gap-2"></div>
    </div>
    <div id="undoBar" class="hidden bg-amber-100 border-t border-amber-200 text-amber-900">
      <div class="max-w-3xl mx-auto px-4 py-2 flex items-center justify-between text-sm">
        <span id="undoBarText">已标记色号</span>
        <button id="undoBarBtn" class="px-3 py-1 rounded-md bg-amber-600 text-white text-xs font-medium hover:bg-amber-700">撤销</button>
      </div>
    </div>
  </header>

  <main id="appMain" class="max-w-3xl mx-auto px-4 py-4 pb-24"></main>

  <nav id="appNav" class="fixed bottom-0 left-0 right-0 z-30 bg-white border-t border-slate-200">
    <div class="max-w-3xl mx-auto px-2 py-2 grid grid-cols-2 gap-2">
      <a href="#/patterns" class="nav-link">图纸</a>
      <a href="#/boards" class="nav-link">板模板</a>
    </div>
  </nav>

  <div id="toastWrap" class="fixed top-16 left-0 right-0 z-50 flex flex-col items-center gap-2 pointer-events-none"></div>

  <script src="./js/db.js"></script>
  <script src="./js/state.js"></script>
  <script src="./js/data/mard221.js"></script>
  <script src="./js/colorMatch.js"></script>
  <script src="./js/parser.js"></script>
  <script src="./js/router.js"></script>
  <script src="./js/views/boardSetup.js"></script>
  <script src="./js/views/patternList.js"></script>
  <script src="./js/views/patternEdit.js"></script>
  <script src="./js/views/patternDetail.js"></script>
  <script src="./js/views/colorFinder.js"></script>
  <script src="./js/views/boardView.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
